name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # 1. 빌드 및 이미지 생성
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # (백엔드 빌드)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Backend
        run: |
          chmod +x ./backend/gradlew
          cd backend
          ./gradlew bootJar -x test

      # (프론트엔드 빌드 - 테스트용)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend (Test Build)
        run: |
          cd frontend
          npm ci
          npm run build

      # (Docker 로그인)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # (백엔드 이미지 빌드 & 푸시)
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/prgrms-be-devcourse/nbe8-10-2-team04/backend:latest

      # (프론트엔드 이미지 빌드 & 푸시)
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/prgrms-be-devcourse/nbe8-10-2-team04/frontend:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://43.203.2.175:8080

  # 2. 서버에 배포 명령 내리기
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            echo "🚀 배포 시작..."
            
            # Docker 로그인 (토큰으로 로그인)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 프로젝트 폴더로 이동
            cd my-app
            
            # 최신 이미지 다운로드
            docker compose pull
            
            # 컨테이너 재시작 (변경된 것만)
            docker compose up -d
            
            # 안 쓰는 이미지 정리
            docker image prune -f
            
            echo "✅ 배포 완료!"